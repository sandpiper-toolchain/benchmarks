name: Score submissions

on:
  pull_request:
    paths:
      - "*/submissions/**"

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install geopandas rasterio scipy numpy shapely pyyaml

      - name: Find changed submission files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep 'submissions/.*/result\.geojson' || true)
          echo "files=$changed" >> "$GITHUB_OUTPUT"

      - name: Score each submission
        if: steps.changed.outputs.files != ''
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            echo "=== Scoring $f ==="
            benchmark_dir=$(echo "$f" | cut -d/ -f1)
            python "$benchmark_dir/scoring/score.py" "$f" \
              --output "${f%result.geojson}score_output.json"
          done

      - name: Upload score artifacts
        if: steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: scores
          path: "**/score_output.json"

  compile:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install geopandas rasterio scipy numpy shapely pyyaml

      - name: Compile results tables
        run: |
          # Find every benchmark that has a compile_results.py script
          benchmarks=$(find . -path '*/scoring/compile_results.py' \
            | sed 's|/scoring/compile_results.py||' \
            | sed 's|^./||')
          for bdir in $benchmarks; do
            echo "=== Compiling $bdir ==="
            python "$bdir/scoring/compile_results.py" "$bdir/"
          done

      - name: Commit updated results tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage any results_table.json files that changed
          git add '**/results_table.json'
          if git diff --cached --quiet; then
            echo "No results_table.json files changed — nothing to commit."
          else
            git commit -m "chore: update results_table.json [skip ci]"
            git push
          fi
