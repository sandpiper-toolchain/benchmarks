name: Score, compile, and publish

on:
  pull_request:
    paths:
      - "benchmarks/*/submissions/**"
  push:
    branches:
      - main
    paths:
      - "benchmarks/*/submissions/**"
      - "benchmarks/*/benchmark.yaml"
      - "benchmarks/*/data/**"
      - "benchmarks/*/display.png"
      - "benchmarks/*/scoring/**"
      - "scoring/**"
      - "run_all.py"
      - "build_site.py"
      - "templates/**"
      - "assets/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/score.yml"

permissions:
  contents: read

jobs:
  score:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install geopandas rasterio scipy numpy shapely pyyaml jinja2

      - name: Detect changed benchmarks and score
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^benchmarks/.*/submissions/' \
            | cut -d/ -f2 | sort -u || true)
          for slug in $changed; do
            echo "=== Scoring $slug ==="
            python run_all.py "$slug"
          done

      - name: Upload score artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scores
          path: "**/score_output.json"
          if-no-files-found: ignore

  compile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install geopandas rasterio scipy numpy shapely pyyaml jinja2

      - name: Compile results tables
        run: python run_all.py

      - name: Build site
        run: python build_site.py --output-dir _site

      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
