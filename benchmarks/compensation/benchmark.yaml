# ── Identity ───────────────────────────────────────────────────────────────────
name:    "Compensation Index — Validation"
slug:    "compensation"
tagline: "Compute κ for two synthetic sequences with known theoretical values"
domain:  "stratigraphy"         # fluvial | coastal | stratigraphy | aeolian | lab | other
status:  "active"               # active | draft | archived

# ── Taxonomy ───────────────────────────────────────────────────────────────────
reference_type: "validation"
data_type:      "value"

# ── Submission format ──────────────────────────────────────────────────────────
submission:
  file_pattern: "results.yaml"
  # Expected keys: compensational_stacking.kappa, random_stacking.kappa

# ── References ─────────────────────────────────────────────────────────────────
# Both datasets use the T_A = 1 synthetic sequences that have theoretical κ
# reference values (Straub et al., 2009).  Sensitivity datasets (T_A = 15, 30)
# live in the companion `compensation_sensitivity` benchmark.
references:
  compensational_stacking:
    label:     "Compensational stacking, T_A = 1"
    data_file: "data/compensational_stacking.csv"
    fields:                        # dict → validation; scored against known truth values
      kappa: 1.0
  random_stacking:
    label:     "Random stacking, T_A = 1"
    data_file: "data/random_stacking.csv"
    fields:
      kappa: 0.50

# ── Scoring ────────────────────────────────────────────────────────────────────
scoring:
  metrics:
    - name:      abs_error
      label:     "Absolute error"
      direction: lower_better
    - name:      rel_error_pct
      label:     "Relative error (%)"
      direction: lower_better
